# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download assets
        run: bash rl_tools/static/hyperdrone/download_blob.sh
      - name: Validate site files
        working-directory: rl_tools/static/hyperdrone
        shell: bash
        run: |
          for file in index.html style.css main.js conta.js pose.json registry.json \
            blob/logo.svg blob/build/hyperdrone_web.js blob/build/hyperdrone_web.wasm; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty site file: $file"
              exit 1
            fi
          done
          jq -er '.reference // (.policy.reference, .drones[0].reference)' pose.json registry.json |
            while IFS= read -r reference; do
              file="blob/${reference#conta:}.gz"
              if [ ! -s "$file" ]; then
                echo "::error::Missing or empty default asset: $file"
                exit 1
              fi
            done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rl_tools/static/hyperdrone
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
